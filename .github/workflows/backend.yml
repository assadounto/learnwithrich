name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: learnwithrich
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: learnwithrich_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnwithrich -d learnwithrich_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://learnwithrich:test-only@127.0.0.1:5432/learnwithrich_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:admin-http
