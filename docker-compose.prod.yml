name: learnwithrich
services:
  web:
    image: learnwithrich:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnwithrich-web
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - learnwithrich-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
    external: true
    name: app_edge
