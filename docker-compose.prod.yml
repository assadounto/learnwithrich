name: learnwithrich
services:
  web:
    image: learnwithrich:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnwithrich-web
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases:
          - learnwithrich-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_USER: learnwithrich
      POSTGRES_DB: learnwithrich
    volumes:
      - database:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnwithrich -d learnwithrich"]
      interval: 5s
      timeout: 3s
      retries: 20
  tools:
    profiles: [operations]
    image: learnwithrich:tools
    build:
      context: .
      target: tools
    env_file: [.env.production]
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
networks:
  internal:
    internal: true
  edge:
    external: true
    name: app_edge
